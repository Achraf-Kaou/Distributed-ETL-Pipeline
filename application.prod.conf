include "application.conf"

etl {
  spark {
    app-name = "Distributed ETL Pipeline - Production Sample"
    master = "local[*]"
    shuffle-partitions = 16
  }

  extract {
    flat-files {
      enabled = true
      path = "data/raw"
      exclude-name-contains = ["departments"]
    }

    apis = [
      {
        name = "customers-mock-api"
        enabled = false
        url = "http://localhost:8081/customers_response.json"
        method = "GET"
        params = {}
        headers = {}
        root-field = "data"
        source-tag = "api_customers"
      }
    ]

    databases = [
      {
        name = "postgres-employees"
        enabled = true
        db-type = "postgres"
        host = "postgres"
        port = 5432
        database = "etl_db"
        user = "etl_user"
        password = "etl_pass"
        table-or-query = "employees"
        source-tag = "postgres"
      },
      {
        name = "mysql-employees"
        enabled = true
        db-type = "mysql"
        host = "mysql"
        port = 3306
        database = "etl_db"
        user = "etl_user"
        password = "etl_pass"
        table-or-query = "employees"
        source-tag = "mysql"
      },
      {
        name = "sqlite-employees"
        enabled = true
        db-type = "sqlite"
        sqlite-file-path = "docker/sqlite/data/etl.db"
        table-or-query = "employees"
        source-tag = "sqlite"
      }
    ]
  }

  load {
    enabled-formats = ["parquet", "csv"]
    output-base-path = "output/production-sample"

    warehouse-target {
      enabled = true
      db-type = "sqlite"
      sqlite-file-path = "output/production-sample/warehouse/etl.db"
      schema = "main"
    }

    upsert {
      enabled = true
      staging-prefix = "stg_"
      batch-size = 500
    }
  }

  audit {
    enabled = true
    output-path = "output/production-sample/audit"
  }

  quarantine {
    enabled = true
    base-path = "output/production-sample/quarantine"
  }
}