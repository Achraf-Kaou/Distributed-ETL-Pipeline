name: ${COMPOSE_PROJECT_NAME:-distributed-etl-pipeline}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${ETL_POSTGRES_CONTAINER:-etl-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ETL_POSTGRES_DB:-etl_db}
      POSTGRES_USER: ${ETL_POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${ETL_POSTGRES_PASSWORD:-etl_pass}
    ports:
      - "${ETL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - etl-network

  mysql:
    image: mysql:8.0
    container_name: ${ETL_MYSQL_CONTAINER:-etl-mysql}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ETL_MYSQL_DB:-etl_db}
      MYSQL_USER: ${ETL_MYSQL_USER:-etl_user}
      MYSQL_PASSWORD: ${ETL_MYSQL_PASSWORD:-etl_pass}
      MYSQL_ROOT_PASSWORD: ${ETL_MYSQL_ROOT_PASSWORD:-root_pass}
    command: --default-authentication-plugin=mysql_native_password --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${ETL_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - etl-network

  sqlite-init:
    image: alpine:3.19
    container_name: ${ETL_SQLITE_CONTAINER:-etl-sqlite-init}
    restart: "no"
    volumes:
      - ./sqlite/init-sqlite.sh:/init-sqlite.sh:ro
      - ./sqlite/init.sql:/init.sql:ro
      - ./sqlite/data:/sqlite/data
    command: ["/bin/sh", "/init-sqlite.sh"]
    networks:
      - etl-network

  pgadmin:
    image: dpage/pgadmin4:8.9
    container_name: ${ETL_PGADMIN_CONTAINER:-etl-pgadmin}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ETL_PGADMIN_EMAIL:-admin@etl.local}
      PGADMIN_DEFAULT_PASSWORD: ${ETL_PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${ETL_PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - etl-network

networks:
  etl-network:
    name: ${ETL_NETWORK_NAME:-etl-network}

volumes:
  postgres-data:
    name: ${ETL_POSTGRES_VOLUME:-etl-postgres-data}
  mysql-data:
    name: ${ETL_MYSQL_VOLUME:-etl-mysql-data}
  pgadmin-data:
    name: ${ETL_PGADMIN_VOLUME:-etl-pgadmin-data}