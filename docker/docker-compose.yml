services:
  postgres:
    image: postgres:16-alpine
    container_name: etl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       etl_db
      POSTGRES_USER:     etl_user
      POSTGRES_PASSWORD: etl_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d etl_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: etl_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      etl_db
      MYSQL_USER:          etl_user
      MYSQL_PASSWORD:      etl_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "etl_user", "-petl_pass"]
      interval: 5s
      timeout: 5s
      retries: 12
    command: --default-authentication-plugin=mysql_native_password

  sqlite-init:
    image: alpine:3.19
    container_name: etl_sqlite_init
    volumes:
      - sqlite_data:/sqlite/data
      - ./sqlite/init.sql:/init.sql:ro
    command: >
      sh -c "apk add --no-cache sqlite && sqlite3 /sqlite/data/etl.db < /init.sql && echo '✅ SQLite DB created at /sqlite/data/etl.db'"
    restart: "no"

volumes:
  postgres_data:
  mysql_data:
  sqlite_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sqlite/data