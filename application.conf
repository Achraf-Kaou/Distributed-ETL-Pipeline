# =============================================================================
# application.conf — Distributed ETL Pipeline Master Configuration
# =============================================================================
#
# Format: HOCON (Human-Optimized Config Object Notation), a superset of JSON.
# Parsed at runtime by the Typesafe Config library via PipelineConfig.load().
#
# All settings live under the root "etl" namespace to allow this file to be
# merged with other HOCON files without key collisions.
#
# ENVIRONMENT VARIABLE OVERRIDES
# Any value can be overridden via environment variable substitution:
#   password = ${?DB_PASSWORD}   <- uses $DB_PASSWORD if set, otherwise the literal below
#
# KEY CONVENTIONS
# - kebab-case keys (e.g. app-name, shuffle-partitions)
# - boolean values: true / false (unquoted)
# - lists: [ "item1", "item2" ]
# - maps: { key = "value" }
# =============================================================================

etl {

  # ---------------------------------------------------------------------------
  # SPARK SESSION
  # ---------------------------------------------------------------------------
  # Controls how the SparkSession is created. In local mode ("local[*]"),
  # Spark runs entirely within the JVM using all available CPU cores.
  # For production cluster deployment, replace master with:
  #   "yarn"                 — Hadoop YARN cluster
  #   "spark://host:7077"    — standalone Spark cluster
  #   "k8s://https://..."    — Kubernetes cluster
  # ---------------------------------------------------------------------------
  spark {
    app-name           = "Distributed ETL Pipeline"
    master             = "local[*]"       # local[*] = all available cores
    shuffle-partitions = 8                # Partitions after join/groupBy shuffle.
                                          # Lower = less overhead for small data.
                                          # Increase (e.g. 200) for cluster runs.
  }

  # ---------------------------------------------------------------------------
  # EXTRACT — Source system declarations
  # ---------------------------------------------------------------------------
  extract {

    # ── Flat Files ────────────────────────────────────────────────────────────
    # Reads all files in `path` whose extension matches a supported format.
    # Supported: .csv, .tsv, .txt, .json, .parquet, .xlsx, .xls, .xml
    # Files whose names contain any string in `exclude-name-contains` are
    # skipped — useful for reference/dimension files used only in joins.
    flat-files {
      enabled               = true
      path                  = "data/raw"
      exclude-name-contains = ["departments"]   # departments.csv is used as a join dim only
    }

    # ── REST API Sources ─────────────────────────────────────────────────────
    # Set enabled=false for sources that are unavailable or not needed.
    # Each source is attempted independently; failures are skipped when
    # skip-non-critical-source-failures = true in orchestration settings.
    #
    # Free public API examples for employee/location enrichment:
    #   https://restcountries.com     — country metadata by name/code
    #   https://api.open-meteo.com   — city weather enrichment by coordinates
    apis = [
      {
        name       = "jsonplaceholder-users"
        enabled    = false                         # Disabled: enable to test API ingestion
        url        = "https://jsonplaceholder.typicode.com/users"
        method     = "GET"
        params     = {}
        headers    = {}
        root-field = ""                            # Response is a JSON array at root level
        source-tag = "api_users"                   # Used for dedup priority ordering
      }
    ]

    # ── JDBC Database Sources ────────────────────────────────────────────────
    # Set enabled=false if the Docker DB services are not running locally.
    # Each source is read into a separate DataFrame, tagged with source-tag,
    # then unioned with all other sources via unionByName.
    #
    # Partitioned reads (parallel JDBC):
    #   Uncomment partition-column, lower-bound, upper-bound, num-partitions
    #   to enable parallel reads. Each partition opens its own JDBC connection.
    #   Ensure num-partitions <= database connection pool size.
    databases = [
      {
        name           = "postgres-employees"
        enabled        = true
        db-type        = "postgres"
        host           = "localhost"
        port           = 5432
        database       = "etl_db"
        user           = "etl_user"
        password       = "etl_pass"
        table-or-query = "employees"               # Plain table name or "(SELECT ...) alias"
        source-tag     = "postgres"                # Priority 1 in dedup config below
        # partition-column = "id"                  # Uncomment for parallel partitioned read
        # lower-bound      = 1
        # upper-bound      = 10000
        # num-partitions   = 4
      },
      {
        name           = "mysql-employees"
        enabled        = true
        db-type        = "mysql"
        host           = "localhost"
        port           = 3306
        database       = "etl_db"
        user           = "etl_user"
        password       = "etl_pass"
        table-or-query = "employees"
        source-tag     = "mysql"                   # Priority 2 in dedup config below
      },
      {
        name             = "sqlite-employees"
        enabled          = true
        db-type          = "sqlite"
        sqlite-file-path = "docker/sqlite/data/etl.db"   # File-based; no host/port/credentials
        table-or-query   = "employees"
        source-tag       = "sqlite"                # Priority 3 in dedup config below
      }
    ]
  }

  # ---------------------------------------------------------------------------
  # TRANSFORM — Multi-step transformation chain
  # ---------------------------------------------------------------------------
  transform {

    # If true, all column names from all sources are normalised to snake_case
    # before any other transformation. This is strongly recommended when sources
    # use inconsistent naming conventions (CamelCase, spaces, hyphens).
    normalize-columns = true

    # Explicit column renames applied AFTER snake_case normalisation.
    # Useful for aligning non-standard source column names to the canonical schema.
    # Example: the second CSV source uses "dept" instead of "department".
    column-mapping = {
      dept      = "department"
      startdate = "join_date"
      location  = "city"
    }

    # ── Cleaning (7-step chain) ───────────────────────────────────────────────
    clean {
      enabled = true

      # Rows where ANY of these columns is null are quarantined and dropped.
      # These are business keys / identifiers that make a row meaningless without them.
      critical-columns = ["id", "full_name", "email"]

      # For non-critical nullable columns: substitute null with these defaults.
      # Values are always strings here; Spark casts them to the column's actual type.
      fill-values = {
        country    = "Unknown"
        age        = "0"
        salary     = "0"
        department = "Unknown"
      }

      # Normalise string columns: trim whitespace + lowercase.
      # Apply only to semantic strings (NOT IDs, codes, or dates).
      string-columns = ["full_name", "city", "country", "email", "department", "status"]

      # Explicit type casts applied after null filling.
      # Use this to override Spark's schema inference with deterministic types.
      cast-columns = {
        age      = "integer"
        salary   = "double"
        join_date = "date"
      }

      # Drop rows where more than this fraction of columns are null.
      # 0.7 = drop rows with more than 70% null columns.
      # Set to 1.0 to disable this check.
      drop-rows-with-nulls-threshold = 0.7

      # Drop rows where ALL column values are identical (full exact duplicates).
      # Business-key deduplication (keep latest/highest-priority) is in the dedup step.
      drop-full-duplicates = true

      normalize-col-names = true   # Must match normalize-columns above
      verbose = true               # Print before/after row counts and null report
    }

    # ── Deduplication ─────────────────────────────────────────────────────────
    # Window-based strategy: for each unique business key, keep the single "best" row.
    # Survival rule: most recent (by recency-column DESC) wins.
    #               On tie: lower source priority number wins (1 = most trusted).
    deduplicate {
      enabled        = true
      key-columns    = ["email"]         # Business key defining uniqueness
      recency-column = "join_date"       # Most recent row wins (DESC)

      # Source trust hierarchy: lower number = higher trust = wins ties.
      # Sources not listed here default to lowest priority (Int.MaxValue).
      source-priority = {
        postgres    = 1
        mysql       = 2
        sqlite      = 3
        file_csv    = 4
        file_json   = 5
        file_parquet = 6
        api_users   = 7
      }

      drop-source-col = true   # Remove __source and __priority helper columns from output
      verbose = true
    }

    # ── Joins ─────────────────────────────────────────────────────────────────
    # Each join entry enriches the main employee DataFrame with data from a
    # secondary source. Joins are applied sequentially (foldLeft).
    joins = [
      {
        name             = "employees-with-departments"
        enabled          = true
        right-source-type = "flat"                              # flat | api | db
        right-path-or-query = "data/raw/departments.csv"

        # right-db-ref: for "db" type, the name of the database source in extract.databases.
        #               for "api" type, optionally the name of an API source.
        right-db-ref     = ""

        join-type        = "left"    # left join: keep all employees even if no dept match

        # key-columns: use when left/right join columns have the SAME name.
        # key-mappings: use when left/right join columns have DIFFERENT names.
        key-columns  = []
        key-mappings = [{ left = "department", right = "dept_id" }]

        # Columns to retain in the output. Unlisted columns from either side are dropped.
        select-columns = [
          "id", "full_name", "age", "email", "salary", "join_date", "status",
          "department", "country", "dim_dept_name", "dim_manager", "dim_city", "dim_budget"
        ]

        left-prefix  = ""      # No prefix on employee (left) columns
        right-prefix = "dim_"  # Prefix all department (right) columns with "dim_"
        verbose = true
      }
    ]

    # ── Aggregation ───────────────────────────────────────────────────────────
    # Collapse enriched rows into summary metrics per business dimension.
    # Output columns are named <column>_<function> when suffix-enabled = true.
    aggregation {
      enabled = true

      group-by = ["department", "country"]   # GROUP BY these dimensions

      metrics = [
        { column = "salary", function = "sum"   }   # → salary_sum
        { column = "salary", function = "avg"   }   # → salary_avg
        { column = "salary", function = "max"   }   # → salary_max
        { column = "id",     function = "count" }   # → id_count (= headcount)
        { column = "age",    function = "avg"   }   # → age_avg
      ]

      suffix-enabled = true   # Append "_<function>" to output column names
    }
  }

  # ---------------------------------------------------------------------------
  # QUALITY GATES
  # ---------------------------------------------------------------------------
  # Runs after clean and dedup stages. Detects issues that survived cleaning.
  # Issues are logged as warnings; set fail-fast=true in orchestration to abort.
  quality {
    enabled              = true
    critical-columns     = ["id", "full_name", "email"]
    max-null-ratio-per-row = 0.7       # Flag rows with > 70% null columns
    deduplication-keys   = ["email"]   # Check for remaining duplicates on this key
  }

  # ---------------------------------------------------------------------------
  # WAREHOUSE — Star schema table definitions
  # ---------------------------------------------------------------------------
  # Controls which tables StarSchemaBuilder recognises as dimensions/fact,
  # and what their surrogate/business keys are for upsert conflict detection.
  warehouse {
    enabled = true

    dimensions = [
      { name = "dim_department", surrogate-key = "department_sk", business-keys = ["department_name"] }
      { name = "dim_employee",   surrogate-key = "employee_sk",   business-keys = ["employee_bk"]     }
      { name = "dim_date",       surrogate-key = "date_sk",       business-keys = ["date_value"]      }
    ]

    fact = {
      name          = "fact_employee_metrics"
      surrogate-key = "fact_id"
      business-keys = ["employee_sk", "department_sk", "date_sk"]
    }
  }

  # ---------------------------------------------------------------------------
  # LOAD — Output format and warehouse target
  # ---------------------------------------------------------------------------
  load {
    # Formats to write the aggregated DataFrame. Supported: "parquet", "csv"
    # CSV uses coalesce(1) → single file; Parquet uses default partition count.
    enabled-formats  = ["parquet", "csv"]
    output-base-path = "output"      # Root directory; subdirs created per run

    # ── Warehouse JDBC target ─────────────────────────────────────────────────
    # The database that receives the star-schema tables via upsert.
    # This is a SEPARATE database from the extract sources (load-db in Docker).
    warehouse-target {
      enabled  = true
      db-type  = "postgres"          # postgres | mysql | sqlite
      host     = "localhost"
      port     = 5433                # load-db runs on 5433 to avoid conflict with extract DB
      database = "load_db"
      user     = "load_user"
      password = "load_pass"
      schema   = "main"
    }

    # ── Upsert (INSERT ... ON CONFLICT) ───────────────────────────────────────
    # Uses the staging-table pattern: write to stg_<table>, then UPSERT into target.
    upsert {
      enabled        = true
      staging-prefix = "stg_"   # Staging tables: stg_dim_employee, stg_dim_department, etc.
      batch-size     = 500      # Rows per JDBC batch INSERT into staging table
    }
  }

  # ---------------------------------------------------------------------------
  # ORCHESTRATION — Stage execution control
  # ---------------------------------------------------------------------------
  # The `stages` list controls which pipeline stages run and in what order.
  # Remove a stage name to skip it entirely. An empty list runs all stages.
  #
  # Available stages (in default order):
  #   extract, clean, dedup, join, aggregate, build_star, load
  orchestration {
    stages = ["extract", "clean", "dedup", "join", "aggregate", "build_star", "load"]

    # If true, any stage exception immediately stops the pipeline.
    # If false, the failed stage returns None and execution continues on best-effort data.
    fail-fast = true

    # If true, a single API or DB source failure is logged as a warning and skipped.
    # If false, any source failure propagates and may abort the extract stage.
    skip-non-critical-source-failures = true
  }

  # ---------------------------------------------------------------------------
  # LOGGING
  # ---------------------------------------------------------------------------
  logging {
    level           = "INFO"    # Root SLF4J log level (Spark is separately set to ERROR in code)
    metrics-enabled = true      # Emit per-stage wall-clock duration in stepEndLog messages
  }

  # ---------------------------------------------------------------------------
  # AUDIT
  # ---------------------------------------------------------------------------
  # JSON Lines audit log written to output/final/warehouse/audit.log.
  # Contains one record per stage (stage_metrics) and one per run (run_summary).
  audit {
    enabled     = true
    output-path = "output/audit"   # Reserved for future use; current path set in EtlPipeline
  }

  # ---------------------------------------------------------------------------
  # QUARANTINE
  # ---------------------------------------------------------------------------
  # Bad rows (nulls in critical columns, missing join keys, etc.) are written
  # to Parquet files here rather than silently dropped.
  # Path structure: output/quarantine/<runId>/<stage>_<reason>/
  quarantine {
    enabled   = true
    base-path = "output/quarantine"
  }
}
