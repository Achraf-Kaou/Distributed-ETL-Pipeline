etl {
  spark {
    app-name = "Distributed ETL Pipeline"
    master = "local[*]"
    shuffle-partitions = 8
  }

  extract {
    flat-files {
      enabled = true
      path = "data/raw"
      exclude-name-contains = ["departments"]
    }

    # Free public API examples related to employee/location enrichment:
    # - https://restcountries.com (country metadata by country name/code)
    # - https://api.open-meteo.com (city weather enrichment by coordinates)
    apis = [
      {
        name = "jsonplaceholder-users"
        enabled = false
        url = "https://jsonplaceholder.typicode.com/users"
        method = "GET"
        params = {}
        headers = {}
        root-field = ""
        source-tag = "api_users"
      }
    ]

    databases = [
      {
        # Set enabled=false if Docker DB services are not running locally.
        name = "postgres-employees"
        enabled = true
        db-type = "postgres"
        host = "localhost"
        port = 5432
        database = "etl_db"
        user = "etl_user"
        password = "etl_pass"
        table-or-query = "employees"
        source-tag = "postgres"
      },
      {
        # Set enabled=false if Docker DB services are not running locally.
        name = "mysql-employees"
        enabled = true
        db-type = "mysql"
        host = "localhost"
        port = 3306
        database = "etl_db"
        user = "etl_user"
        password = "etl_pass"
        table-or-query = "employees"
        source-tag = "mysql"
      },
      {
        # Set enabled=false if Docker DB services are not running locally.
        name = "sqlite-employees"
        enabled = true
        db-type = "sqlite"
        sqlite-file-path = "docker/sqlite/data/etl.db"
        table-or-query = "employees"
        source-tag = "sqlite"
      }
    ]
  }

  transform {
    normalize-columns = true

    # Source schema normalization aliases
    column-mapping = {
      dept = "department"
      startdate = "join_date"
      location = "city"
    }

    clean {
      enabled = true
      critical-columns = ["id", "full_name", "email"]
      fill-values = {
        country = "Unknown"
        age = "0"
        salary = "0"
        department = "Unknown"
      }
      string-columns = ["full_name", "city", "country", "email", "department", "status"]
      cast-columns = {
        age = "integer"
        salary = "double"
        join_date = "date"
      }
      drop-rows-with-nulls-threshold = 0.7
      drop-full-duplicates = true
      normalize-col-names = true
      verbose = true
    }

    deduplicate {
      enabled = true
      key-columns = ["email"]
      recency-column = "join_date"
      source-priority = {
        postgres = 1
        mysql = 2
        sqlite = 3
        file_csv = 4
        file_json = 5
        file_parquet = 6
        api_users = 7
      }
      drop-source-col = true
      verbose = true
    }

    joins = [
      {
        name = "employees-with-departments"
        enabled = true
        right-source-type = "flat"
        right-path-or-query = "data/raw/departments.csv"
        # Used for db joins (database source name) and optional api joins (api source name).
        right-db-ref = ""
        join-type = "left"
        # Use key-columns when left/right join column names are identical.
        # Use key-mappings when left/right join column names differ.
        key-columns = []
        key-mappings = [{ left = "department", right = "dept_id" }]
        select-columns = [
          "id", "full_name", "age", "email", "salary", "join_date", "status",
          "department", "country", "dim_dept_name", "dim_manager", "dim_city", "dim_budget"
        ]
        left-prefix = ""
        right-prefix = "dim_"
        verbose = true
      }
    ]

    aggregation {
      enabled = true

      # Group by these columns
      group-by = ["department", "country"]

      # Metrics to calculate
      metrics = [
        { column = "salary", function = "sum" }
        { column = "salary", function = "avg" }
        { column = "salary", function = "max" }
        { column = "id",     function = "count" }
        { column = "age",    function = "avg" }
      ]

      # Output column naming strategy
      suffix-enabled = true
      # e.g. salary_sum, salary_avg
    }
  }

  quality {
    enabled = true
    critical-columns = ["id", "full_name", "email"]
    max-null-ratio-per-row = 0.7
    deduplication-keys = ["email"]
  }

  warehouse {
    enabled = true
    dimensions = [
      { name = "dim_department", surrogate-key = "department_sk", business-keys = ["department_name"] }
      { name = "dim_employee", surrogate-key = "employee_sk", business-keys = ["employee_bk"] }
      { name = "dim_date", surrogate-key = "date_sk", business-keys = ["date_value"] }
    ]
    fact = {
      name = "fact_employee_metrics"
      surrogate-key = "fact_id"
      business-keys = ["employee_sk", "department_sk", "date_sk"]
    }
  }

  load {
    enabled-formats = ["parquet", "csv"]
    output-base-path = "output"

    warehouse-target {
      enabled = true
      db-type = "postgres"
      host = "localhost"
      port = 5433
      database = "load_db"
      user = "load_user"
      password = "load_pass"
      schema = "main"
    }

    upsert {
      enabled = true
      staging-prefix = "stg_"
      batch-size = 500
    }
  }

  orchestration {
    stages = ["extract", "clean", "dedup", "join", "aggregate", "build_star", "load"]
    fail-fast = true
    skip-non-critical-source-failures = true
  }

  logging {
    level = "INFO"
    metrics-enabled = true
  }

  audit {
    enabled = true
    output-path = "output/audit"
  }

  quarantine {
    enabled = true
    base-path = "output/quarantine"
  }
}
